[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hired-hands"
version = "0.1.0"
description = "Workcell daemon: three SO-101 arms that take paid jobs and settle on the XRP Ledger"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "lerobot",
  "xrpl-py>=5.2",
  "x402-xrpl>=0.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "supabase>=2.0",
  "anthropic>=0.40",
  "opencv-python>=4.8",
  "numpy>=1.26",
  "scipy>=1.11",
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.scripts]
hands = "hired_hands.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hired_hands*"]

[tool.ruff]
line-length = 110
target-version = "py312"
